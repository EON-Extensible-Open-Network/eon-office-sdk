# cargo-deny: supply chain and licence gate (madde 37).
# A dependency is a commitment; this file makes the commitment explicit.

[advisories]
yanked = "deny"

[licenses]
private = { ignore = true }

# MIT project: permissive inbound licences only, so an application built on
# the SDK never inherits a licensing question from it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
