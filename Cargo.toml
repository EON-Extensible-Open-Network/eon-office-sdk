[package]
name = "eon-office-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
description = "Client library for EON Office applications: find the core, authenticate, call the protocol, receive events, invocations and jobs."
repository = "https://github.com/EON-Extensible-Open-Network/eon-office-sdk"
publish = false

# One dependency. The protocol is JSON over a socket; the standard library
# has the socket.
[dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
